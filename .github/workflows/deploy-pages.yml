name: Deploy to GitHub Pages
# Live site must publish THIS workflow’s artifact (Settings → Pages → Source → GitHub Actions).
# Serving the repo branch (e.g. main / root) publishes raw index.html with /src/main.tsx → blank page.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Opt into Actions-on-Node until defaults switch (suppresses deprecation noise)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # production mode → vite.config base = /your-life/
      - name: Build
        run: pnpm run build

      - name: Verify index bundles
        run: |
          set -euo pipefail
          test -f dist/index.html
          if grep -q '/src/main\.' dist/index.html; then
            echo 'dist/index.html still references dev /src/main — build did not bundle (wrong vite mode or wrong file).'; exit 1
          fi
          grep -qE '/your-life/assets/[^"[:space:]]+\.(js)' dist/index.html || (echo 'dist/index.html missing /your-life/assets/*.js'; exit 1)
          grep -qE '/your-life/(assets/[^"]+\.css|favicon\.svg)' dist/index.html || (echo 'dist/index.html missing /your-life CSS or favicon'; exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
